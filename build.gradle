plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and library repositories automatically.
}

loom {
	mods {
		"iron_golem_troll" {
			sourceSet sourceSets.main
		}
	}
}

// In-world tests (src/gametest): server game tests run as part of `build`,
// the visual client test opens a game window and runs with `runClientGameTest`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "iron_golem_troll_test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	// Versions live in gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain unit tests for the Minecraft-independent math
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
